<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Patient | MediCase</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon">✚</div><span>MediCase</span></div><div class="nav-title">WORKSPACE</div><a class="nav " href="dashboard.html"><span class="nav-icon">◈</span><span>Dashboard</span></a><a class="nav " href="patients.html"><span class="nav-icon">◉</span><span>Patients</span></a><a class="nav active" href="add-patient.html"><span class="nav-icon">＋</span><span>Add Patient</span></a><div class="nav-title">SYSTEM</div>
<a class="nav " href="report.html"><span class="nav-icon">▤</span><span>Reports</span></a><a class="nav" href="#" onclick="logout();return false"><span class="nav-icon">↪</span><span>Logout</span></a>
<div style="position:absolute;left:17px;right:17px;bottom:20px;padding:12px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025);font-size:10px;color:#668198"><span class="pulse"></span> System online</div></aside>
<main class="main"><div class="topbar"><div class="title"><h1>Register Patient</h1><p>Create a polished digital patient record.</p></div></div><form id="patientForm" class="card"><div class="formsection"><h3>01 / Patient Information</h3><div class="formgrid">
<div class="formgroup"><label>PATIENT ID *</label><input name="patientId" placeholder="PAT-1003" required></div><div class="formgroup"><label>FULL NAME *</label><input name="fullName" placeholder="Enter patient's full name" required></div>
<div class="formgroup"><label>AGE *</label><input name="age" type="number" min="0" required></div><div class="formgroup"><label>GENDER</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
<div class="formgroup"><label>PHONE *</label><input name="phone" type="tel" required></div><div class="formgroup"><label>BLOOD GROUP</label><select name="bloodGroup"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
<div class="formgroup full"><label>ADDRESS</label><textarea name="address" placeholder="Residential address"></textarea></div></div></div>
<div class="formsection"><h3>02 / Safety & Emergency</h3><div class="formgrid"><div class="formgroup"><label>EMERGENCY CONTACT</label><input name="emergencyContact"></div><div class="formgroup"><label>KNOWN ALLERGIES</label><input name="allergies" placeholder="None / medication / food"></div></div></div>
<div class="row"><a href="patients.html"><button type="button" class="btn secondary">Cancel</button></a><button class="btn primary">Save Patient →</button></div></form></main></div><script src="js/app.js"></script></body></html>
